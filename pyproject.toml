[project]
name = "mgnifam"
version = "0.1.0"
description = "Iterative HMM-based protein family generation over very large sequence databases"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vangelis Karatzas", email = "vagkaratzas1990@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pyfamsa>=0.7.0",
    "pyhmmer>=0.12.1",
    "pytrimal>=0.8.5",
]

[project.scripts]
generate-families = "mgnifam.generate_families:main"

[project.urls]
Repository = "https://github.com/vagkaratzas/mgnifam"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgnifam"]

[dependency-groups]
dev = ["pre-commit>=4.4.0", "pytest>=9.0.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
